rulesetName: "Custom Ruleset"
rulesetDescription: "Custom ruleset for testing AxiomModuleBuilder"

businessChecks:
  - name: isEnterpriseCompany
    description: Determines if the organization is classified as an enterprise company
  - name: hasRevenueAboveThreshold
    description: Checks if the company's revenue is above a specified threshold
    params:
      - thresholdAmount
  - name: hasFraudSignals
    description: Determines if the request contains signals that indicate potential fraudulent activity
  - name: hasRiskScore
    description: Checks if the risk score is above a specified threshold
    params:
      - threshold

businessActions:
  - name: requireApproval
    description: Marks the suspension decision as requiring manual approval before proceeding
  - name: blockRequest
    description: Blocks the suspension request entirely

rules:
  - name: "Custom Enterprise Rule"
    description: "Custom rule for enterprise companies"
    expression: isEnterpriseCompany() then requireApproval()
    priority: 100
    effectiveFrom: "2023-01-01T00:00:00Z"
    
  - name: "Custom High Risk Rule"
    description: "Custom rule for high risk transactions"
    expression: hasRiskScore(90) then blockRequest()
    priority: 80
    effectiveFrom: "2023-05-15T00:00:00Z" 