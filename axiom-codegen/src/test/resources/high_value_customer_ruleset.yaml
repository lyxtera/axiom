rulesetName: "High Value Customer Ruleset"
rulesetDescription: "Rules for determining whether a customer qualifies for a discount"

businessChecks:
  - name: isHighValueCustomer
    description: Determines if the customer has high spending patterns
    params:
      - thresholdAmount
  - name: hasLoyaltyStatus
    description: Checks if the customer has loyalty status

businessActions:
  - name: applyDiscount
    description: Applies a discount to the customer's order
    params:
      - percentage

rules:
  - name: "High Value Customer Rule"
    description: "Apply discount for high value customers"
    expression: isHighValueCustomer(1000) then applyDiscount(10)
    priority: 10
    effectiveFrom: "2023-01-01T00:00:00Z"
    
  - name: "Loyalty Status Rule"
    description: "Apply discount for customers with loyalty status"
    expression: hasLoyaltyStatus() then applyDiscount(5)
    priority: 20
    effectiveFrom: "2023-06-15T00:00:00Z"

